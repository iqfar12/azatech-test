name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API · lint, static analysis, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop-local-only
          POSTGRES_DB: online_shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d online_shop_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: online_shop_test
      DB_USERNAME: shop
      DB_PASSWORD: shop-local-only
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pcntl, posix, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate --ansi

      - name: Lint (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest, real PostgreSQL + Redis, incl. concurrency)
        run: php artisan test

  frontend:
    name: Web · lint, type-check, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Component tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker · build images and smoke test the stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8080/ > /dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@azatech.id","password":"password"}' | jq -r '.data.access_token')
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/products?per_page=1" | jq -e '.meta.total >= 50'
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/orders?per_page=1" | jq -e '.meta.total >= 150'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v
